<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>প্যাকেজ | alimixstore</title><link rel="icon" href="logo.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0D9488'}}}}</script>
<style>
*{font-family:'Hind Siliguri',sans-serif}body{background:#F1F5F9;color:#0F172A}
.card{background:#fff;border:1px solid #E2E8F0}.btn{background:linear-gradient(120deg,#0D9488,#10B981);color:#fff}.btn:disabled{opacity:.5}
.in{width:100%;background:#F8FAFC;border:1px solid #dbe4ee;border-radius:.75rem;padding:.7rem 1rem;font-size:.875rem;margin-bottom:.75rem}.in:focus{outline:none;border-color:#14b8a6}
.pkg{border:1.5px solid #fca5a5;border-radius:14px;background:#fff;padding:14px 6px;text-align:center;box-shadow:0 3px 7px rgba(15,23,42,.1);transition:.2s}
.pkg:hover{transform:translateY(-2px);border-color:#ef4444}
.pkg.star{border-color:#93c5fd}.pkg.star:hover{border-color:#1877F2}.pkg.star .pill{background:linear-gradient(135deg,#3b8bff,#0b57c9)}
.pk-icon{width:40px;height:40px;margin:0 auto 4px}.pk-icon svg{width:100%;height:100%}
#wrap{position:relative}#wrap.collapsed .pkg:nth-child(n+7){display:none}
#wrap .fade{display:none;position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.85) 55%,#fff);pointer-events:none}
#more{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:8px 20px;border-radius:9999px;border:1.5px solid #fca5a5;background:#fff;color:#dc2626;font-size:14px;font-weight:700;box-shadow:0 6px 16px -6px rgba(15,23,42,.28)}
#wrap.collapsed .fade{display:block}#wrap.collapsed #more{display:inline-block}
.pill{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:999px;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ef233c,#b91c1c)}
</style></head>
<body>
<header class="bg-white border-b border-slate-200"><div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
 <a href="index.html" class="font-extrabold text-primary">alimixstore</a><a href="index.html" class="text-xs font-semibold border border-slate-200 rounded-full px-4 py-2">← হোম</a></div></header>

<main class="max-w-3xl mx-auto px-4 py-6">
 <p id="nf" class="hidden text-center py-16">পোস্টটি খুঁজে পাওয়া যায়নি।</p>
 <div id="view" class="hidden card rounded-3xl overflow-hidden shadow-sm">
  <div class="flex items-center gap-4 p-5 sm:p-6" style="background:linear-gradient(135deg,#0F172A,#1e3a5f)">
   <div id="hImg" class="hidden w-16 h-16 sm:w-24 sm:h-24 rounded-2xl overflow-hidden shrink-0 bg-white"><img id="hImgTag" alt="" class="w-full h-full object-cover"></div>
   <div><h1 id="title" class="text-lg sm:text-2xl font-bold text-white"></h1><p id="desc" class="text-xs sm:text-sm text-slate-300 mt-1"></p></div>
  </div>
  <div class="p-5 sm:p-6">
  <p class="text-xs text-red-500 font-semibold bg-red-50 border border-red-100 rounded-xl px-4 py-3 mb-5">অর্ডার করার পর অর্ডারের স্ক্রিনশট টেলিগ্রাম/হোয়াটসঅ্যাপে দিবেন, তারপর অর্ডার কনফার্ম করা হবে।</p>
  <p class="text-xs font-extrabold mb-3">✦ PREMIUM PACKAGES — প্যাকেজ নির্বাচন করুন</p>
  <div id="wrap"><div id="grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div><div class="fade"></div><button type="button" id="more">আরো দেখুন ⌄</button></div>
  <p id="empty" class="hidden text-center text-sm text-slate-400 py-8">এখনো কোনো প্যাকেজ নেই।</p>
  </div>
 </div>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
 <div class="card rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto p-5">
  <div class="flex justify-between items-start mb-3"><h3 id="mName" class="font-bold text-lg"></h3><button id="mClose" class="w-8 h-8 rounded-full bg-slate-100">✕</button></div>
  <div id="form">
   <label id="accLbl" class="text-xs font-semibold block mb-1"></label><input id="acc" class="in"/>
   <label class="text-xs font-semibold block mb-1">আপনার নাম *</label><input id="nm" class="in"/>
   <label class="text-xs font-semibold block mb-1">WhatsApp নাম্বার *</label><input id="ph" type="tel" class="in" placeholder="01XXXXXXXXX"/>
   <label class="text-xs font-semibold block mb-1">কুপন কোড (ঐচ্ছিক)</label>
   <div class="flex gap-2"><input id="cp" class="in flex-1"/><button id="cpBtn" type="button" class="btn px-4 rounded-xl text-xs font-semibold mb-3">এপ্লাই</button></div>
   <p id="cpMsg" class="hidden text-xs mb-3"></p>
   <label class="text-xs font-semibold block mb-1">পেমেন্ট মেথড *</label>
   <select id="pm" class="in"><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option></select>
   <div class="bg-teal-50 border border-teal-200 rounded-xl px-4 py-3 mb-3 text-sm">
    <p>পরিশোধযোগ্য: <b id="total"></b></p><p>সেন্ডমানি (<span id="pmL"></span>): <b id="sn" class="text-primary"></b> <button id="cpy" type="button" class="text-[11px] text-primary underline ml-1">কপি</button></p></div>
   <p id="rule" class="text-[11.5px] bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 mb-3"></p>
   <label class="text-xs font-semibold block mb-1">যে নাম্বার থেকে পাঠিয়েছেন *</label><input id="pn" type="tel" class="in"/>
   <label class="text-xs font-semibold block mb-1">Transaction ID *</label><input id="tx" class="in"/>
   <p id="err" class="hidden text-xs text-red-500 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-3"></p>
   <button id="sub" class="btn w-full py-3 rounded-xl text-sm font-semibold">অর্ডার জমা দিন</button>
  </div>
  <div id="done" class="hidden text-center py-4"><p class="text-4xl mb-2">🧾</p><p class="font-bold">অর্ডার জমা হয়েছে!</p>
   <p class="text-xs text-slate-500 my-2">Order ID: <b id="oid"></b></p>
   <a id="waDone" target="_blank" class="block btn py-3 rounded-xl text-sm font-semibold mt-3">💬 WhatsApp-এ জানান</a></div>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDoc,addDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyAa8YiG1P7rZoCg-enQ0E2HflfDY7JFPyQ",authDomain:"alimixstoretopup.firebaseapp.com",projectId:"alimixstoretopup",storageBucket:"alimixstoretopup.firebasestorage.app",messagingSenderId:"102854684850",appId:"1:102854684850:web:c11f6ee301a29ffdc7d9ab"}));
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RULES={bkash:"নিজস্ব bKash পারসোনাল নাম্বার থেকে সেন্ডমানি করুন। ৫০০ টাকার বেশি হলে হাজারে ১৫ টাকা ক্যাশআউট চার্জ প্রযোজ্য। থার্ডপার্টি সিম/মার্চেন্ট থেকে পাঠাবেন না।",nagad:"নগদে সেন্ডমানি করুন, ক্যাশআউট/মার্চেন্ট নয়। নিজস্ব নাম্বার থেকে পাঠান।",rocket:"রকেটে সেন্ডমানি করুন, ক্যাশআউট/মার্চেন্ট নয়। নিজস্ব নাম্বার থেকে পাঠান।"};
const LBL={bkash:'bKash',nagad:'Nagad',rocket:'Rocket'};
const coinSvg=i=>`<svg viewBox="0 0 48 48"><defs><radialGradient id="c${i}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".45" stop-color="#FFD452"/><stop offset="1" stop-color="#E8960C"/></radialGradient></defs><circle cx="24" cy="24" r="21" fill="url(#c${i})" stroke="#B4740A" stroke-width="1.5"/><circle cx="24" cy="24" r="16.5" fill="none" stroke="#fffdf0" stroke-width="1.4" stroke-dasharray="2.6 3.4"/><text x="24" y="31" text-anchor="middle" font-size="19" font-weight="800" fill="#9A5B00">♪</text></svg>`;
const starSvg=i=>`<svg viewBox="0 0 48 48"><defs><linearGradient id="s${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FBBF24"/><stop offset="1" stop-color="#E8960C"/></linearGradient></defs><path d="M24 4l5.8 12 13.2 1.9-9.6 9.3 2.3 13.1L24 34l-11.7 6.3 2.3-13.1L5 17.9 18.2 16z" fill="url(#s${i})" stroke="#B4740A" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
let expanded=false;
let CFG={},POST=null,PKGS=[],cur=null,disc=0,code='',busy=false;
const pid=new URLSearchParams(location.search).get('id');
const phone=v=>{v=String(v||'').replace(/[\s-]/g,'');if(/^01\d{9}$/.test(v))return'+88'+v;if(/^8801\d{9}$/.test(v))return'+'+v;if(/^\+8801\d{9}$/.test(v))return v;return''};
onSnapshot(doc(db,'settings','storeConfig'),s=>{CFG=s.exists()?s.data():{};pay()});

async function init(){
 if(!pid)return $('nf').classList.remove('hidden');
 const s=await getDoc(doc(db,'posts',pid)).catch(()=>null);
 if(!s||!s.exists())return $('nf').classList.remove('hidden');
 POST={id:s.id,...s.data()};document.title=POST.title+' | alimixstore';
 $('title').textContent=POST.title;$('desc').textContent=POST.desc||'';$('view').classList.remove('hidden');
 if(POST.image){$('hImgTag').src=POST.image;$('hImg').classList.remove('hidden')}
 // ছবি নেই — শুধু টেক্সট। পুরনো coin/star ডেটা থাকলে source=coinPackages/starPackages দিলে সেগুলোই দেখাবে
 const src=POST.source||'packages';
 onSnapshot(collection(db,src),sn=>{
  PKGS=sn.docs.map(d=>{const x=d.data();return{id:d.id,label:x.label||(x.coins?x.coins+' Coins':x.stars?x.stars+' Stars':''),price:+x.price||0,oldPrice:+x.oldPrice||0,order:x.coins||x.stars||x.order||0,couponCode:x.couponCode||'',couponDiscount:+x.couponDiscount||0,postId:x.postId}}).filter(x=>x.label&&(src!=='packages'||x.postId===pid)).sort((a,b)=>a.order-b.order);
  $('empty').classList.toggle('hidden',PKGS.length>0);
  const ic=POST.icon||(POST.accountType==='facebook'?'star':'coin');
  $('grid').innerHTML=PKGS.map((p,i)=>`<button data-i="${i}" class="pkg ${ic==='star'?'star':''}">${ic==='none'?'':`<span class="pk-icon block">${ic==='star'?starSvg(i):coinSvg(i)}</span>`}<p class="font-extrabold text-base">${esc(p.label)}</p>${p.oldPrice>p.price?`<p class="text-[11px] text-slate-400 line-through">৳${p.oldPrice}</p>`:''}<span class="pill">৳${p.price}</span></button>`).join('');
  $('wrap').classList.toggle('collapsed',PKGS.length>6&&!expanded);
 });
}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.pkg');if(!b)return;cur=PKGS[+b.dataset.i];disc=0;code='';
 $('mName').textContent=`${POST.title} — ${cur.label}`;$('accLbl').textContent=POST.accountLabel||'TikTok Username@ *';
 ['acc','nm','ph','cp','pn','tx'].forEach(i=>$(i).value='');$('cpMsg').classList.add('hidden');$('err').classList.add('hidden');
 $('form').classList.remove('hidden');$('done').classList.add('hidden');pay();$('modal').classList.remove('hidden')});
$('more').onclick=()=>{expanded=true;$('wrap').classList.remove('collapsed')};
$('mClose').onclick=()=>$('modal').classList.add('hidden');
function pay(){if(!cur)return;const m=$('pm').value;$('pmL').textContent=LBL[m];
 $('sn').textContent=CFG[m+'Number']||'শীঘ্রই যোগ হবে';$('rule').textContent='⚠️ '+(CFG[m+'Rule']||RULES[m]);$('total').textContent='৳'+Math.max(cur.price-disc,0)}
$('pm').onchange=pay;
$('cpy').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('sn').textContent);
$('cpBtn').onclick=()=>{const v=$('cp').value.trim().toUpperCase(),m=$('cpMsg');m.classList.remove('hidden');
 if(cur.couponCode&&v===cur.couponCode.toUpperCase()){code=cur.couponCode;disc=Math.min(cur.couponDiscount,cur.price);m.textContent=`কুপন প্রয়োগ হয়েছে! ৳${disc} ছাড়।`;m.className='text-xs mb-3 text-emerald-600'}
 else{code='';disc=0;m.textContent='কুপন সঠিক নয় বা এই প্যাকেজে প্রযোজ্য নয়।';m.className='text-xs mb-3 text-red-500'}pay()};
$('sub').onclick=async()=>{
 if(busy)return;const fail=m=>{$('err').textContent=m;$('err').classList.remove('hidden')};
 const acc=$('acc').value.trim(),nm=$('nm').value.trim(),ph=phone($('ph').value),pn=phone($('pn').value),tx=$('tx').value.trim().replace(/\s+/g,'');
 if(acc.length<2)return fail('অ্যাকাউন্ট/লিংক দিন।');if(nm.length<2)return fail('নাম দিন।');if(!ph)return fail('সঠিক WhatsApp নাম্বার দিন।');
 if(!pn)return fail('পেমেন্ট নাম্বার দিন।');if(tx.length<5)return fail('সঠিক Transaction ID দিন।');
 busy=true;$('sub').disabled=true;$('err').classList.add('hidden');
 try{
  const fin=Math.max(cur.price-disc,0),m=$('pm').value;
  // অর্ডারের ফিল্ড আগের মতোই — তাই অ্যাডমিনের অর্ডার ও কুপন রিপোর্ট ঠিকঠাক চলবে
  const o={productId:cur.id,productType:'package',productName:`${POST.title} — ${cur.label}`,originalPrice:cur.price,offerPrice:fin,coinPackagePrice:cur.price,couponApplied:!!code&&disc>0,couponCode:code,couponDiscount:disc,accountType:POST.accountType||'tiktok',accountIdentifier:acc,customerName:nm,customerPhone:ph,paymentMethod:m,paymentNumber:pn,transactionId:tx,status:'pending',createdAt:serverTimestamp()};
  const r=await addDoc(collection(db,'orders'),o);const sid=r.id.slice(0,8).toUpperCase();
  const t=String(CFG.telegramBotToken||'').trim(),c=String(CFG.telegramChatId||'').trim();
  if(t&&c)fetch(`https://api.telegram.org/bot${encodeURIComponent(t)}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c,text:`🛒 নতুন অর্ডার\nID: ${sid}\n${o.productName}\n৳${fin}${code?` (কুপন ${code})`:''}\n${acc}\n${ph}\n${LBL[m]} ${pn}\nTxn: ${tx}`})}).catch(()=>{});
  $('oid').textContent=sid;$('waDone').href=`https://wa.me/${String(CFG.whatsappNumber||'8801948901917').replace(/\D/g,'')}?text=${encodeURIComponent(`Hello alimixstore, অর্ডার করেছি।\nID: ${sid}\n${o.productName}\nমূল্য: ৳${fin}\nTxn: ${tx}`)}`;
  $('form').classList.add('hidden');$('done').classList.remove('hidden');
 }catch(e){console.error(e);fail('অর্ডার জমা হয়নি, আবার চেষ্টা করুন।')}
 busy=false;$('sub').disabled=false};
init();
</script></body></html>
